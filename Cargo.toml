[package]
name = "jtag-scanner"
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
authors = [
    "wuwbobo <wuwbobo@outlook.com>",
]
description = "A JTAG boundary scanning module"
repository = "https://codeberg.org/wuwbobo/jtag-scanner"
categories = ["embedded", "hardware-support", "development-tools::debugging"]
keywords = ["embedded", "JTAG", "BSDL"]
license = "MIT"

[dependencies]
bitvec = "1.1.1"
bsdl = "0.1.1"
jtag_idcode = { version = "0.1.1", features = ["jep106"] }
jtag-taps = { version = "0.6.2", optional = true }
embedded-hal = { version = "1.0.0", optional = true }

[features]
default = ["protocol", "protocol-spi", "backend-jtag-taps"]
backend-jtag-taps = [ "dep:jtag-taps" ]
protocol = [ "dep:embedded-hal" ]
protocol-spi = ["protocol"]
